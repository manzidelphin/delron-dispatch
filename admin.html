<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delron Dispatch — Admin Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.SUPABASE_URL = 'https://jflntnlfbvhybggrmbqd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmbG50bmxmYnZoeWJnZ3JtYnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA5NjUsImV4cCI6MjEwMzM0Njk2NX0.ZIMOGiusG9OEO3yyJuTCnWTfYAxzgsykeT0hS11CYDg';
        window.SUPABASE_ANON_KEY = SUPABASE_ANON_KEY;
    </script>
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(10px);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border-radius: 9999px;
            padding: 0.35rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <section id="login-section" class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md glass-panel rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center h-16 w-16 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 mb-4">
                    <i class="fa-solid fa-lock text-2xl"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-white">Delron Dispatch</h1>
                <p class="text-sm text-slate-400 mt-2">Dispatcher Admin Login</p>
            </div>

            <form id="login-form" class="space-y-5" onsubmit="event.preventDefault(); return false;">
                <div>
                    <label for="admin-email-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input id="admin-email-input" type="email" required placeholder="admin@delrondispatch.com" class="w-full rounded-xl border border-slate-700 bg-slate-900 pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500" />
                    </div>
                </div>

                <div>
                    <label for="admin-password-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input id="admin-password-input" type="password" required placeholder="Enter password" class="w-full rounded-xl border border-slate-700 bg-slate-900 pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500" />
                    </div>
                </div>

                <div id="login-error-message" class="hidden rounded-xl border border-red-500/40 bg-red-500/10 px-3 py-2 text-xs text-red-200"></div>

                <button id="login-button" type="button" class="w-full rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 text-sm transition">
                    Sign In to Dashboard
                </button>
            </form>
        </div>
    </section>

    <section id="dashboard-section" class="hidden min-h-screen">
        <header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                    <p class="text-xs uppercase tracking-[0.25em] text-amber-400 font-semibold">Operations</p>
                    <h1 class="text-xl md:text-2xl font-black text-white">Delron Dispatch — Admin Operations</h1>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 rounded-full border border-slate-700 bg-slate-900 px-3 py-2 text-xs text-slate-300">
                        <i class="fa-solid fa-user-shield text-amber-500"></i>
                        <span id="admin-email-display">Loading...</span>
                    </div>
                    <button id="signout-button" class="rounded-xl border border-slate-700 bg-slate-900 px-4 py-2 text-sm font-semibold text-slate-200 hover:border-amber-500 hover:text-amber-400 transition">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i>Sign Out
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
            <section class="grid gap-4 md:grid-cols-2 xl:grid-cols-4 mb-8">
                <div class="glass-panel rounded-2xl p-5 shadow-lg">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs uppercase tracking-[0.2em] text-slate-400">Total Carriers</span>
                        <i class="fa-solid fa-users text-amber-500"></i>
                    </div>
                    <div id="total-carriers" class="text-3xl font-black text-white">0</div>
                </div>

                <div class="glass-panel rounded-2xl p-5 shadow-lg">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs uppercase tracking-[0.2em] text-slate-400">Dry Van</span>
                        <i class="fa-solid fa-truck text-amber-500"></i>
                    </div>
                    <div id="dryvan-count" class="text-3xl font-black text-white">0</div>
                </div>

                <div class="glass-panel rounded-2xl p-5 shadow-lg">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs uppercase tracking-[0.2em] text-slate-400">Reefer</span>
                        <i class="fa-solid fa-snowflake text-amber-500"></i>
                    </div>
                    <div id="reefer-count" class="text-3xl font-black text-white">0</div>
                </div>

                <div class="glass-panel rounded-2xl p-5 shadow-lg">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs uppercase tracking-[0.2em] text-slate-400">Flatbed</span>
                        <i class="fa-solid fa-trailer text-amber-500"></i>
                    </div>
                    <div id="flatbed-count" class="text-3xl font-black text-white">0</div>
                </div>
            </section>

            <section class="glass-panel rounded-2xl p-4 sm:p-5 mb-6">
                <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                    <div class="flex-1">
                        <label for="search-input" class="sr-only">Search carriers</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>
                            <input id="search-input" type="text" placeholder="Search by company, MC number, or equipment type" class="w-full rounded-xl border border-slate-700 bg-slate-900 pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500" />
                        </div>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-slate-400">
                        <span class="status-badge bg-amber-500/10 text-amber-300 border border-amber-500/20">
                            <i class="fa-solid fa-circle" aria-hidden="true"></i> Live
                        </span>
                    </div>
                </div>
            </section>

            <section class="glass-panel rounded-2xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left text-sm text-slate-200">
                        <thead class="bg-slate-900/90 text-slate-300 border-b border-slate-700">
                            <tr>
                                <th class="px-4 py-3 font-semibold">Date</th>
                                <th class="px-4 py-3 font-semibold">Company Name</th>
                                <th class="px-4 py-3 font-semibold">MC / DOT</th>
                                <th class="px-4 py-3 font-semibold">Contact / Phone</th>
                                <th class="px-4 py-3 font-semibold">Email</th>
                                <th class="px-4 py-3 font-semibold">Equipment</th>
                                <th class="px-4 py-3 font-semibold">Target Rate</th>
                                <th class="px-4 py-3 font-semibold">Preferred Lanes</th>
                                <th class="px-4 py-3 font-semibold">Documents</th>
                            </tr>
                        </thead>
                        <tbody id="carriers-table-body" class="divide-y divide-slate-800"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loginSection = document.getElementById('login-section');
            const dashboardSection = document.getElementById('dashboard-section');
            const loginErrorMessage = document.getElementById('login-error-message');
            const loginButton = document.getElementById('login-button');
            const signoutButton = document.getElementById('signout-button');
            const searchInput = document.getElementById('search-input');
            const tableBody = document.getElementById('carriers-table-body');
            const adminEmailDisplay = document.getElementById('admin-email-display');

            const totalCarriersEl = document.getElementById('total-carriers');
            const dryvanCountEl = document.getElementById('dryvan-count');
            const reeferCountEl = document.getElementById('reefer-count');
            const flatbedCountEl = document.getElementById('flatbed-count');

            const supabase = window.supabase ? window.supabase.createClient(window.SUPABASE_URL, SUPABASE_ANON_KEY) : null;
            let allCarriers = [];

            function showDashboard(userEmail) {
                document.getElementById('login-section')?.classList.add('hidden');
                document.getElementById('dashboard-section')?.classList.remove('hidden');
                const emailEl = document.getElementById('admin-email-display');
                if (emailEl) emailEl.textContent = userEmail || '';
                loadCarriers();
            }

            function showLogin() {
                document.getElementById('dashboard-section')?.classList.add('hidden');
                document.getElementById('login-section')?.classList.remove('hidden');
            }

            function formatDate(value) {
                if (!value) return '—';
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return value;
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            function setLoginError(message) {
                if (!loginErrorMessage) return;
                loginErrorMessage.textContent = message || '';
                loginErrorMessage.classList.toggle('hidden', !message);
            }

            function renderMetrics(carriers) {
                const total = Array.isArray(carriers) ? carriers.length : 0;
                const dryVan = Array.isArray(carriers) ? carriers.filter((c) => String(c.equipment_type || '').toLowerCase().includes('dry van')).length : 0;
                const reefer = Array.isArray(carriers) ? carriers.filter((c) => String(c.equipment_type || '').toLowerCase().includes('reefer')).length : 0;
                const flatbed = Array.isArray(carriers) ? carriers.filter((c) => String(c.equipment_type || '').toLowerCase().includes('flatbed')).length : 0;

                if (totalCarriersEl) totalCarriersEl.textContent = String(total);
                if (dryvanCountEl) dryvanCountEl.textContent = String(dryVan);
                if (reeferCountEl) reeferCountEl.textContent = String(reefer);
                if (flatbedCountEl) flatbedCountEl.textContent = String(flatbed);
            }

            async function loadCarriers() {
                if (!tableBody) return;

                if (!supabase) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="9" class="px-4 py-10 text-center text-red-300">Supabase client is unavailable.</td>
                        </tr>
                    `;
                    return;
                }

                try {
                    const { data, error } = await supabase
                        .from('carriers')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    const carriers = Array.isArray(data) ? data : [];
                    allCarriers = carriers;
                    renderMetrics(carriers);

                    tableBody.innerHTML = carriers.map((c) => {
                        const companyName = c.company_name || 'N/A';
                        const mcDot = c.mc_dot_number || 'N/A';
                        const contact = c.contact_name_phone || 'N/A';
                        const email = c.email || 'N/A';
                        const equipment = c.equipment_type || 'N/A';
                        const targetRate = c.target_rate_per_mile || 'N/A';
                        const preferredLanes = c.preferred_lanes || 'N/A';

                        const docs = [
                            { label: 'MC Authority', url: c.mc_authority_url, icon: 'fa-file-pdf' },
                            { label: 'W-9', url: c.w9_url, icon: 'fa-file-invoice' },
                            { label: 'Insurance COI', url: c.insurance_certificate_url, icon: 'fa-shield-halved' }
                        ];

                        const docMarkup = docs.map((doc) => {
                            if (!doc.url) {
                                return `<span class="inline-flex items-center gap-1 rounded-lg border border-slate-700 bg-slate-800 px-2 py-1 text-[10px] font-bold text-slate-500">${doc.label}</span>`;
                            }

                            return `
                                <a href="${doc.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 rounded-lg border border-amber-500/40 bg-amber-500/10 px-2 py-1 text-[10px] font-bold text-amber-300 hover:bg-amber-500/20">
                                    <i class="fa-solid ${doc.icon}"></i>${doc.label}
                                </a>
                            `;
                        }).join('');

                        return `
                            <tr class="border-b border-slate-800">
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${formatDate(c.created_at)}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-white font-semibold">${companyName}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${mcDot}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${contact}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${email}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${equipment}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${targetRate}</td>
                                <td class="px-4 py-3 max-w-xs text-slate-300">${preferredLanes}</td>
                                <td class="px-4 py-3"><div class="flex flex-wrap gap-2">${docMarkup}</div></td>
                            </tr>
                        `;
                    }).join('');
                } catch (error) {
                    console.error('Failed to load carrier data:', error);
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="9" class="px-4 py-10 text-center text-red-300">
                                Unable to load carriers. ${error?.message || 'Please try again.'}
                            </td>
                        </tr>
                    `;
                }
            }

            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    const query = searchInput.value.trim().toLowerCase();
                    if (!query) {
                        renderMetrics(allCarriers);
                        loadCarriers();
                        return;
                    }

                    const filtered = allCarriers.filter((carrier) => {
                        const searchable = [
                            carrier.company_name,
                            carrier.mc_dot_number,
                            carrier.equipment_type,
                            carrier.preferred_lanes,
                            carrier.email,
                            carrier.contact_name_phone
                        ].join(' ').toLowerCase();
                        return searchable.includes(query);
                    });

                    renderMetrics(filtered);
                    tableBody.innerHTML = filtered.map((c) => {
                        const docs = [
                            { label: 'MC Authority', url: c.mc_authority_url, icon: 'fa-file-pdf' },
                            { label: 'W-9', url: c.w9_url, icon: 'fa-file-invoice' },
                            { label: 'Insurance COI', url: c.insurance_certificate_url, icon: 'fa-shield-halved' }
                        ];

                        const docMarkup = docs.map((doc) => {
                            if (!doc.url) {
                                return `<span class="inline-flex items-center gap-1 rounded-lg border border-slate-700 bg-slate-800 px-2 py-1 text-[10px] font-bold text-slate-500">${doc.label}</span>`;
                            }
                            return `<a href="${doc.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 rounded-lg border border-amber-500/40 bg-amber-500/10 px-2 py-1 text-[10px] font-bold text-amber-300 hover:bg-amber-500/20"><i class="fa-solid ${doc.icon}"></i>${doc.label}</a>`;
                        }).join('');

                        return `
                            <tr class="border-b border-slate-800">
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${formatDate(c.created_at)}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-white font-semibold">${c.company_name || 'N/A'}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${c.mc_dot_number || 'N/A'}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${c.contact_name_phone || 'N/A'}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${c.email || 'N/A'}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${c.equipment_type || 'N/A'}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-slate-300">${c.target_rate_per_mile || 'N/A'}</td>
                                <td class="px-4 py-3 max-w-xs text-slate-300">${c.preferred_lanes || 'N/A'}</td>
                                <td class="px-4 py-3"><div class="flex flex-wrap gap-2">${docMarkup}</div></td>
                            </tr>
                        `;
                    }).join('');
                });
            }

            loginButton?.addEventListener('click', async (event) => {
                event.preventDefault();

                if (!supabase) {
                    setLoginError('Supabase is not configured correctly.');
                    return;
                }

                const email = document.getElementById('admin-email-input')?.value.trim();
                const password = document.getElementById('admin-password-input')?.value;

                if (!email || !password) {
                    setLoginError('Please enter both your email and password.');
                    return;
                }

                loginButton.disabled = true;
                loginButton.textContent = 'Signing In...';
                setLoginError('');

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    if (data?.user) {
                        showDashboard(data.user.email);
                    }
                } catch (error) {
                    setLoginError(error?.message || 'Login failed. Please try again.');
                } finally {
                    loginButton.disabled = false;
                    loginButton.textContent = 'Sign In to Dashboard';
                }
            });

            signoutButton?.addEventListener('click', async () => {
                if (!supabase) {
                    if (dashboardSection) dashboardSection.classList.add('hidden');
                    if (loginSection) loginSection.classList.remove('hidden');
                    return;
                }

                await supabase.auth.signOut();
                if (dashboardSection) dashboardSection.classList.add('hidden');
                if (loginSection) loginSection.classList.remove('hidden');
                if (adminEmailDisplay) adminEmailDisplay.textContent = 'Loading...';
                setLoginError('');
            });

            if (supabase) {
                const { data: { session } } = await supabase.auth.getSession();
                if (session?.user) {
                    showDashboard(session.user.email);
                } else {
                    showLogin();
                }
            } else {
                showLogin();
            }
        });
    </script>
</body>
</html>
